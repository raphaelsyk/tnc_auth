[project]
name = "tnc-auth"
version = "0.1.0"
description = "Tech and Croissant to explain authentication and authorization using FastAPI"
readme = "README.md"
authors = [
    { name = "Raphael Schymczyk", email = "raphael.schymczyk@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.128.0",
    "greenlet>=3.3.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "sqlalchemy>=2.0.45",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.110",
]

